spring:
  application:
    name: spring-modulith-demo
  devtools:
    restart:
      enabled: true
      additional-paths:
        - src/main/java
        - src/main/resources
      exclude: static/**,public/**
    livereload:
      enabled: true
  docker:
    compose:
      lifecycle-management: start_only
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false  # event_publication is created by Flyway
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/master
          jwk-set-uri: http://localhost:8180/realms/master/protocol/openid-connect/certs

weather:
  api:
    key: demo  # Replace with your actual OpenWeatherMap API key
    base-url: https://api.openweathermap.org/data/2.5
management:
  endpoints:
    web:
      exposure:
        include: modulith, health, info, prometheus

springdoc:
  swagger-ui:
    path: "/apidoc"
    groups-order: desc
logging:
  level:
    org.flywaydb: INFO

